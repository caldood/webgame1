<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SD Little League Derby</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===================== START SCREEN ===================== -->
  <div id="startScreen" class="screen active">
    <div class="screen-inner">
      <div class="sun"></div>
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>

      <div class="logo-wrap">
        <div class="cap-badge">LA</div>
        <h1 class="game-title">Home Run<br>Derby</h1>
        <p class="sub-title">San Diego Little League</p>
      </div>

      <div class="scoreboard-box">
        <p>Hit 10 pitches.<br>Time your swing perfectly!</p>
        <div class="scoring-key">
          <span class="key-hr">⚾ Home Run — 10 pts</span>
          <span class="key-deep">💥 Deep Hit — 5 pts</span>
          <span class="key-ground">🏃 Grounder — 1 pt</span>
          <span class="key-miss">❌ Miss — 0 pts</span>
        </div>
      </div>

      <button id="startBtn" class="btn-main">PLAY BALL!</button>
      <p class="tap-hint">Tap anywhere to swing</p>
    </div>
  </div>

  <!-- ===================== GAME SCREEN ===================== -->
  <div id="gameScreen" class="screen">
    <!-- HUD -->
    <div id="hud">
      <div class="hud-block">
        <span class="hud-label">SCORE</span>
        <span id="scoreDisplay" class="hud-value">0</span>
      </div>
      <div class="hud-center">
        <span id="pitchResult" class="pitch-result"></span>
      </div>
      <div class="hud-block">
        <span class="hud-label">PITCHES</span>
        <span id="pitchesDisplay" class="hud-value">10</span>
      </div>
    </div>

    <!-- Main canvas where the game is drawn -->
    <canvas id="gameCanvas"></canvas>

    <!-- Timing meter (shown during pitch) -->
    <div id="timingMeter" class="timing-meter hidden">
      <div class="meter-label">TIMING</div>
      <div class="meter-track">
        <div class="meter-zone perfect"></div>
        <div class="meter-zone good left"></div>
        <div class="meter-zone good right"></div>
        <div id="meterIndicator" class="meter-indicator"></div>
      </div>
      <div class="meter-hint">TAP TO SWING</div>
    </div>

    <!-- Swing button (big invisible overlay for mobile taps) -->
    <div id="swingZone"></div>
  </div>

  <!-- ===================== END SCREEN ===================== -->
  <div id="endScreen" class="screen">
    <div class="screen-inner">
      <div class="sun"></div>
      <h2 class="end-title">GAME OVER!</h2>

      <div class="final-scoreboard">
        <div class="sb-row header">
          <span>PLAYER</span><span>HR</span><span>SCORE</span>
        </div>
        <div class="sb-row">
          <span class="sb-name">YOU</span>
          <span id="finalHR">0</span>
          <span id="finalScore">0</span>
        </div>
      </div>

      <div id="ratingMsg" class="rating-msg"></div>

      <div id="hitLog" class="hit-log"></div>

      <button id="playAgainBtn" class="btn-main">PLAY AGAIN!</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
